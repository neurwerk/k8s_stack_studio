[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-stack-studio-collector"
version = "0.27.0"
description = "Studio hourly LLM and MCP usage collection"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["asyncpg>=0.30.0", "httpx>=0.28.0", "pydantic>=2.12.0", "pydantic-settings>=2.7"]

[project.scripts]
k8s-stack-studio-collector = "studio_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_collector"]

[tool.ruff]
extend = "../api/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S", "T20", "TRY003"]
"**/__init__.py" = ["D104"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[dependency-groups]
dev = ["ruff>=0.15.20", "ty>=0.0.55", "pytest>=8", "pytest-asyncio>=0.24.0"]
